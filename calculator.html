<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ماشین‌حساب تلگرام</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .calc {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 20px;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .display {
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    text-align: left;
    color: #fff;
    font-size: 28px;
    font-weight: 300;
    min-height: 60px;
    word-wrap: break-word;
    word-break: break-all;
    direction: ltr;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    padding: 18px;
    font-size: 20px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: rgba(255,255,255,0.2);
    color: #fff;
    transition: all 0.15s;
    font-weight: 500;
  }
  button:active { transform: scale(0.95); background: rgba(255,255,255,0.35); }
  .op { background: rgba(255,152,0,0.5); }
  .op:active { background: rgba(255,152,0,0.7); }
  .eq { background: rgba(76,175,80,0.6); grid-column: span 2; }
  .eq:active { background: rgba(76,175,80,0.8); }
  .clear { background: rgba(244,67,54,0.5); }
  .clear:active { background: rgba(244,67,54,0.7); }
  .zero { grid-column: span 2; }
  h1 {
    text-align: center;
    color: #fff;
    font-size: 18px;
    margin-bottom: 16px;
    font-weight: 600;
  }
  .footer {
    text-align: center;
    color: rgba(255,255,255,0.6);
    font-size: 11px;
    margin-top: 12px;
  }
</style>
</head>
<body>
<div class="calc">
  <h1>🧮 ماشین‌حساب</h1>
  <div class="display" id="display">0</div>
  <div class="buttons">
    <button class="clear" onclick="clearAll()">C</button>
    <button onclick="deleteLast()">⌫</button>
    <button class="op" onclick="appendOp('%')">%</button>
    <button class="op" onclick="appendOp('/')">÷</button>

    <button onclick="appendNum('7')">7</button>
    <button onclick="appendNum('8')">8</button>
    <button onclick="appendNum('9')">9</button>
    <button class="op" onclick="appendOp('*')">×</button>

    <button onclick="appendNum('4')">4</button>
    <button onclick="appendNum('5')">5</button>
    <button onclick="appendNum('6')">6</button>
    <button class="op" onclick="appendOp('-')">−</button>

    <button onclick="appendNum('1')">1</button>
    <button onclick="appendNum('2')">2</button>
    <button onclick="appendNum('3')">3</button>
    <button class="op" onclick="appendOp('+')">+</button>

    <button class="zero" onclick="appendNum('0')">0</button>
    <button onclick="appendDot()">.</button>
    <button class="eq" onclick="calculate()">=</button>
  </div>
  <div class="footer">HTML Widget — Telegram 13.2+</div>
</div>

<script>
  let display = document.getElementById('display');
  let current = '0';
  let justCalculated = false;

  function updateDisplay() {
    display.textContent = current;
  }

  function appendNum(n) {
    if (justCalculated) { current = n; justCalculated = false; }
    else if (current === '0') current = n;
    else current += n;
    updateDisplay();
  }

  function appendDot() {
    if (justCalculated) { current = '0.'; justCalculated = false; return; }
    let parts = current.split(/[\+\-\*\/%]/);
    let last = parts[parts.length - 1];
    if (!last.includes('.')) current += '.';
    updateDisplay();
  }

  function appendOp(op) {
    justCalculated = false;
    if (/[+\-*/%]$/.test(current)) {
      current = current.slice(0, -1) + op;
    } else {
      current += op;
    }
    updateDisplay();
  }

  function clearAll() {
    current = '0';
    justCalculated = false;
    updateDisplay();
  }

  function deleteLast() {
    if (justCalculated) { current = '0'; justCalculated = false; }
    else {
      current = current.slice(0, -1) || '0';
    }
    updateDisplay();
  }

  function calculate() {
    try {
      let expr = current.replace(/×/g, '*').replace(/÷/g, '/');
      let result = Function('"use strict"; return (' + expr + ')')();
      if (!isFinite(result)) throw new Error('خطا');
      current = String(Math.round(result * 1e10) / 1e10);
      justCalculated = true;
      updateDisplay();
    } catch (e) {
      current = 'خطا';
      justCalculated = true;
      updateDisplay();
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') appendNum(e.key);
    else if (e.key === '.') appendDot();
    else if (e.key === '+') appendOp('+');
    else if (e.key === '-') appendOp('-');
    else if (e.key === '*') appendOp('*');
    else if (e.key === '/') { e.preventDefault(); appendOp('/'); }
    else if (e.key === '%') appendOp('%');
    else if (e.key === 'Enter' || e.key === '=') calculate();
    else if (e.key === 'Backspace') deleteLast();
    else if (e.key === 'Escape') clearAll();
  });
</script>
</body>
</html>
